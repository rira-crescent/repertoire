<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>rira♡☾ repertoire TEST</title>

  <!-- テスト専用CSSだけを読み込む -->
  <link
    rel="stylesheet"
    href="test.css?v=9"
  >

</head>


<body>

  <main class="container">


    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="header">

      <div class="header-title">

        <h1>
          rira♡☾ repertoire
        </h1>

        <img
          src="icon.png"
          class="header-icon"
          alt="rira"
        >

      </div>

      <p id="song-count">
        0曲
      </p>

    </header>



    <!-- =========================
         検索
    ========================== -->

    <section class="search-area">

      <input
        type="search"
        id="search-input"
        placeholder="曲名・アーティストを検索"
        autocomplete="off"
      >

    </section>



    <!-- =========================
         フィルター
    ========================== -->

    <section class="filter-area">

      <div
        id="genre-buttons"
        class="genre-buttons"
      ></div>


      <div class="filter-options">

        <label class="favorite-filter">

          <input
            type="checkbox"
            id="favorite-only"
          >

          ⭐ 得意曲だけ

        </label>


        <select
          id="sort-select"
          class="sort-select"
          aria-label="並び替え"
        >

          <option value="default">
            登録順
          </option>

          <option value="title">
            曲名順
          </option>

          <option value="artist">
            アーティスト順
          </option>

          <option value="genre">
            ジャンル順
          </option>

          <option value="favorite">
            ⭐ 得意曲優先
          </option>

        </select>

      </div>

    </section>



    <!-- =========================
         曲一覧
    ========================== -->

    <section
      id="song-list"
      class="song-list"
    ></section>


    <p
      id="no-results"
      class="no-results"
      hidden
    >
      該当する曲がありません
    </p>


  </main>


  <!-- 機能は本番と共通 -->
  <script src="script.js?v=3"></script>


</body>

</html>
