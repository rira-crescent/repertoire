<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>rira♡☾ repertoire</title>

  <!-- 本番のデザイン -->
  <link rel="stylesheet" href="style.css">

  <!-- test.html専用の追加デザイン -->
  <link rel="stylesheet" href="test.css?v=3">
</head>

<body>

  <main class="container">

    <!-- タイトル -->
    <header class="header">

      <div class="profile-title">

        <img
          src="icon.png"
          class="profile-icon"
          alt="rira"
        >

        <div class="profile-text">

          <h1>rira♡☾ repertoire</h1>

          <p id="song-count">
            歌える曲 0曲
          </p>

        </div>

      </div>

    </header>


    <!-- 検索 -->
    <section class="search-area">

      <input
        type="search"
        id="search-input"
        placeholder="曲名・アーティストを検索"
        autocomplete="off"
      >

    </section>


    <!-- フィルター -->
    <section class="filter-area">

      <!-- ジャンル -->
      <div
        id="genre-buttons"
        class="genre-buttons"
      ></div>


      <div class="filter-options">

        <!-- 得意曲だけ -->
        <label class="favorite-filter">

          <input
            type="checkbox"
            id="favorite-only"
          >

          ⭐ 得意曲だけ

        </label>


        <!-- 並び替え -->
        <select
          id="sort-select"
          class="sort-select"
          aria-label="並び替え"
        >

          <option value="default">
            登録順
          </option>

          <option value="title">
            曲名順
          </option>

          <option value="artist">
            アーティスト順
          </option>

          <option value="genre">
            ジャンル順
          </option>

          <option value="favorite">
            ⭐ 得意曲優先
          </option>

        </select>

      </div>

    </section>


    <!-- 曲一覧 -->
    <section
      id="song-list"
      class="song-list"
    ></section>


    <!-- 0件 -->
    <p
      id="no-results"
      class="no-results"
      hidden
    >
      該当する曲がありません
    </p>

  </main>


  <!-- 本番と同じJavaScript -->
  <script src="script.js?v=2"></script>

</body>

</html>
