<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>rira♡☾ repertoire</title>

  <!-- 本番と同じCSS -->
  <link
    rel="stylesheet"
    href="style.css?v=1"
  >

  <!-- test.html専用CSS -->
  <link
    rel="stylesheet"
    href="test.css?v=7"
  >

</head>


<body>

  <main class="container">


    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="header">

      <div class="title-center">


        <!-- タイトル -->

        <div class="title-line">

          <h1>
            rira♡☾ repertoire
          </h1>


          <!-- アイコン -->

          <img
            src="icon.png"
            class="profile-icon"
            alt="rira"
          >

        </div>


        <!-- 曲数 -->

        <p id="song-count">
          0曲
        </p>


      </div>

    </header>



    <!-- =========================
         検索
    ========================== -->

    <section class="search-area">

      <input
        type="search"
        id="search-input"
        placeholder="曲名・アーティストを検索"
        autocomplete="off"
      >

    </section>



    <!-- =========================
         フィルター
    ========================== -->

    <section class="filter-area">


      <!-- ジャンル -->

      <div
        id="genre-buttons"
        class="genre-buttons"
      ></div>



      <!-- 得意曲・並び替え -->

      <div class="filter-options">


        <label class="favorite-filter">

          <input
            type="checkbox"
            id="favorite-only"
          >

          ⭐ 得意曲だけ

        </label>



        <select
          id="sort-select"
          class="sort-select"
          aria-label="並び替え"
        >

          <option value="default">
            登録順
          </option>

          <option value="title">
            曲名順
          </option>

          <option value="artist">
            アーティスト順
          </option>

          <option value="genre">
            ジャンル順
          </option>

          <option value="favorite">
            ⭐ 得意曲優先
          </option>

        </select>


      </div>

    </section>



    <!-- =========================
         曲一覧
    ========================== -->

    <section
      id="song-list"
      class="song-list"
    ></section>



    <!-- =========================
         検索結果なし
    ========================== -->

    <p
      id="no-results"
      class="no-results"
      hidden
    >
      該当する曲がありません
    </p>


  </main>


  <!-- 本番と同じJavaScript -->

  <script src="script.js?v=3"></script>


</body>

</html>
