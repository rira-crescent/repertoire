<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <!-- iPhoneなどスマホで正しい大きさに表示するため -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>rira♡☾ repertoire</title>

  <!-- デザイン用CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <!-- タイトル -->
    <header class="header">
      <h1>rira♡☾ repertoire</h1>
      <p id="song-count">歌える曲 0曲</p>
    </header>


    <!-- 検索 -->
    <section class="search-area">

      <input
        type="search"
        id="search-input"
        placeholder="曲名・アーティストを検索"
        autocomplete="off"
      >

    </section>


    <!-- ジャンル -->
    <section class="filter-area">

      <div
        id="genre-buttons"
        class="genre-buttons"
      >
        <!--
          songs.jsに登録したジャンルから
          script.jsが自動的にボタンを作ります
        -->
      </div>


      <!-- 得意曲だけ表示 -->
      <label class="favorite-filter">

        <input
          type="checkbox"
          id="favorite-only"
        >

        ⭐ 得意曲だけ

      </label>

    </section>


    <!-- 曲一覧 -->
    <section
      id="song-list"
      class="song-list"
    >
      <!--
        ここにscript.jsが
        曲を自動表示します
      -->
    </section>


    <!-- 検索結果が0件だった場合 -->
    <p
      id="no-results"
      class="no-results"
      hidden
    >
      該当する曲がありません
    </p>

  </main>


  <!--
    順番が重要
    ①script.jsでそのデータを表示する
  -->

  <script src="script.js"></script>

</body>

</html>
