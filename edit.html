<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>曲データ編集</title>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

  color: #49383f;

  background:
    linear-gradient(
      180deg,
      #fff0f5,
      #fffafd
    );

  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;

  border: 0;
  border-radius: 9px;

  cursor: pointer;
}

.container {
  width: 100%;
  max-width: 700px;

  margin: auto;

  /* 固定操作パネル用 */
  padding:
    18px 9px
    330px;
}


/* =========================
   タイトル
========================= */

h1 {
  margin:
    0 0 4px;

  text-align: center;

  color: #d85c89;

  font-size: 22px;
}

.count {
  margin-bottom: 14px;

  text-align: center;

  color: #b36b85;

  font-size: 13px;
}


/* =========================
   上部
========================= */

.toolbar {
  display: flex;

  gap: 7px;

  margin-bottom: 10px;
}

.add-button,
.download-button {
  flex: 1;

  height: 40px;

  color: white;

  font-size: 13px;
  font-weight: bold;
}

.add-button {
  background: #e8759e;
}

.download-button {
  background: #bd557a;
}


/* =========================
   検索
========================= */

#search {
  width: 100%;
  height: 43px;

  margin-bottom: 8px;

  padding:
    0 15px;

  border:
    1px solid #f2b8cc;

  border-radius: 22px;

  outline: none;

  background: white;

  font-size: 16px;
}

#search:focus {
  border-color: #db759a;

  box-shadow:
    0 0 0 3px
    rgba(219,117,154,.10);
}


/* =========================
   フィルター
========================= */

.filters {
  display: flex;

  gap: 6px;

  margin-bottom: 8px;
}

.filters select {
  flex: 1;

  min-width: 0;

  height: 38px;

  padding:
    0 8px;

  border:
    1px solid #f2b8cc;

  border-radius: 10px;

  outline: none;

  background: white;

  color: #b85679;

  font-size: 12px;
}


/* =========================
   表示中を選択
========================= */

.select-tools {
  margin-bottom: 10px;
}

.select-visible-button {
  width: 100%;

  height: 36px;

  border:
    1px solid #efbfd0;

  background: white;

  color: #b85679;

  font-size: 12px;
  font-weight: 600;
}


/* =========================
   曲一覧
========================= */

.song {
  display: flex;

  align-items: center;

  gap: 6px;

  min-height: 57px;

  margin-bottom: 5px;

  padding: 7px;

  border:
    1px solid #f4ccd9;

  border-radius: 11px;

  background: white;
}

.song.selected {
  border-color: #dc769c;

  background: #fff3f7;
}

.select-song {
  flex-shrink: 0;

  width: 19px;
  height: 19px;

  margin:
    0 2px;

  accent-color: #e8759e;
}

.song-info {
  flex: 1;

  min-width: 0;
}

.song-title {
  margin-bottom: 2px;

  overflow: hidden;

  color: #49383f;

  font-size: 14px;
  font-weight: bold;

  white-space: nowrap;

  text-overflow: ellipsis;
}

.song-meta {
  overflow: hidden;

  color: #987080;

  font-size: 11px;

  white-space: nowrap;

  text-overflow: ellipsis;
}

.edit-button,
.delete-button {
  flex-shrink: 0;

  height: 31px;

  padding:
    0 8px;

  font-size: 11px;
}

.edit-button {
  background: #ffe3ed;

  color: #b94f74;
}

.delete-button {
  background: #f4f4f4;

  color: #888;
}


/* =========================
   固定操作パネル
========================= */

.selection-panel {
  display: none;

  position: fixed;

  left: 50%;
  bottom: 10px;

  transform:
    translateX(-50%);

  z-index: 1000;

  width:
    calc(100% - 16px);

  max-width: 680px;

  padding: 10px;

  border:
    1px solid #efbfd0;

  border-radius: 14px;

  background:
    rgba(
      255,
      245,
      248,
      .97
    );

  box-shadow:
    0 4px 20px
    rgba(
      100,
      40,
      60,
      .18
    );

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);
}

.selection-panel.show {
  display: block;
}

.selection-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  margin-bottom: 8px;
}

.selection-count {
  color: #bd557a;

  font-size: 13px;
  font-weight: bold;
}

.clear-selection {
  min-height: 32px;

  padding:
    0 10px;

  border:
    1px solid #ddd;

  background: white;

  color: #777;

  font-size: 11px;
}


/* =========================
   移動
========================= */

.move-buttons {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 5px;
}

.move-buttons button {
  min-height: 36px;

  border:
    1px solid #efbfd0;

  background: white;

  color: #b85679;

  font-size: 12px;
}

.position-row {
  display: flex;

  gap: 6px;

  margin-top: 7px;
}

#movePosition {
  flex: 1;

  min-width: 0;

  height: 38px;

  padding:
    0 10px;

  border:
    1px solid #efbfd0;

  border-radius: 8px;

  outline: none;

  background: white;

  font-size: 16px;
}

.position-button {
  min-height: 38px;

  padding:
    0 12px;

  background: #e8759e;

  color: white;

  font-size: 12px;
  font-weight: bold;
}


/* =========================
   ジャンル一括変更
========================= */

.bulk-genre-area {
  margin-top: 9px;

  padding-top: 8px;

  border-top:
    1px solid #f1d1dc;
}

.bulk-genre-label {
  margin-bottom: 5px;

  color: #a66a80;

  font-size: 11px;
}

.bulk-genre-row {
  display: flex;

  gap: 6px;
}

#bulkGenre {
  flex: 1;

  min-width: 0;

  height: 38px;

  padding:
    0 9px;

  border:
    1px solid #efbfd0;

  border-radius: 8px;

  outline: none;

  background: white;

  color: #8e5870;

  font-size: 13px;
}

.bulk-genre-button {
  min-width: 68px;

  height: 38px;

  padding:
    0 12px;

  background: #e8759e;

  color: white;

  font-size: 12px;
  font-weight: bold;
}


/* =========================
   曲編集モーダル
========================= */

.modal {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 2000;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(
      60,
      30,
      40,
      .35
    );
}

.modal.show {
  display: flex;
}

.form {
  width: 100%;
  max-width: 420px;

  padding: 20px;

  border-radius: 18px;

  background: white;

  box-shadow:
    0 10px 40px
    rgba(
      100,
      40,
      60,
      .2
    );
}

.form h2 {
  margin:
    0 0 18px;

  color: #d85c89;

  font-size: 19px;
}

.form label {
  display: block;

  margin:
    12px 0 4px;

  color: #966477;

  font-size: 12px;
}

.form input[type="text"],
.form select {
  width: 100%;

  height: 42px;

  padding:
    0 10px;

  border:
    1px solid #efbfd0;

  border-radius: 9px;

  background: white;

  font-size: 16px;
}

.favorite-row {
  display: flex;

  align-items: center;

  gap: 7px;

  margin:
    15px 0;
}

.favorite-row input {
  width: 19px;
  height: 19px;

  accent-color: #e8759e;
}

.form-buttons {
  display: flex;

  gap: 8px;

  margin-top: 18px;
}

.cancel,
.save {
  flex: 1;

  height: 40px;
}

.cancel {
  background: #eee;
}

.save {
  background: #e8759e;

  color: white;

  font-weight: bold;
}

.back {
  display: block;

  margin-top: 18px;

  text-align: center;

  color: #b85679;

  text-decoration: none;

  font-size: 13px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 500px) {

  .container {
    padding:
      16px 8px
      330px;
  }

  .song {
    gap: 5px;
  }

  .edit-button,
  .delete-button {
    padding:
      0 6px;

    font-size: 10px;
  }

  .move-buttons {
    grid-template-columns:
      repeat(2, 1fr);
  }

}

</style>

</head>


<body>


<div class="container">


<h1>🎵 曲データ編集</h1>

<div
  id="count"
  class="count"
></div>


<div class="toolbar">

  <button
    class="add-button"
    onclick="openAdd()"
  >
    ＋ 曲を追加
  </button>

  <button
    class="download-button"
    onclick="downloadCSV()"
  >
    CSVを保存
  </button>

</div>


<input
  id="search"
  type="search"
  placeholder="🔍 曲名・アーティストを検索"
>


<div class="filters">

  <select id="genreFilter">

    <option value="すべて">
      すべてのジャンル
    </option>

  </select>


  <select id="favoriteFilter">

    <option value="all">
      すべての曲
    </option>

    <option value="favorite">
      ⭐ 得意曲
    </option>

    <option value="normal">
      得意曲以外
    </option>

  </select>

</div>


<div class="select-tools">

  <button
    class="select-visible-button"
    onclick="selectVisible()"
  >
    ☑ 表示中をすべて選択
  </button>

</div>


<div id="songList"></div>


<a
  class="back"
  href="index.html"
>
  ← 曲リストに戻る
</a>


</div>



<!-- ======================
     下部固定パネル
====================== -->

<div
  id="selectionPanel"
  class="selection-panel"
>

  <div class="selection-header">

    <div
      id="selectionCount"
      class="selection-count"
    >
      0曲選択中
    </div>


    <button
      class="clear-selection"
      onclick="clearSelection()"
    >
      ✕ 選択キャンセル
    </button>

  </div>


  <div class="move-buttons">

    <button
      onclick="moveSelected(-1)"
    >
      ↑ 1つ上
    </button>

    <button
      onclick="moveSelected(1)"
    >
      ↓ 1つ下
    </button>

    <button
      onclick="moveToTop()"
    >
      ⇈ 先頭へ
    </button>

    <button
      onclick="moveToBottom()"
    >
      ⇊ 末尾へ
    </button>

  </div>


  <div class="position-row">

    <input
      id="movePosition"
      type="number"
      min="1"
      inputmode="numeric"
      placeholder="移動先の番号"
    >

    <button
      class="position-button"
      onclick="moveToPosition()"
    >
      番目へ移動
    </button>

  </div>


  <!-- ジャンル一括変更 -->

  <div class="bulk-genre-area">

    <div class="bulk-genre-label">
      選択した曲のジャンルを一括変更
    </div>


    <div class="bulk-genre-row">

      <select
        id="bulkGenre"
      ></select>


      <button
        class="bulk-genre-button"
        onclick="changeSelectedGenre()"
      >
        変更
      </button>

    </div>

  </div>

</div>



<!-- ======================
     曲編集モーダル
====================== -->

<div
  id="modal"
  class="modal"
>

<div class="form">


<h2 id="formTitle">
  曲を編集
</h2>


<label>
  曲名
</label>

<input
  id="title"
  type="text"
>


<label>
  アーティスト
</label>

<input
  id="artist"
  type="text"
>


<label>
  ジャンル
</label>

<select id="genre"></select>


<label>
  新しいジャンル
</label>

<input
  id="newGenre"
  type="text"
  placeholder="新しいジャンルを入力"
>


<div class="favorite-row">

  <input
    id="favorite"
    type="checkbox"
  >

  <span>
    ⭐ 得意曲
  </span>

</div>


<div class="form-buttons">

  <button
    class="cancel"
    onclick="closeModal()"
  >
    キャンセル
  </button>


  <button
    class="save"
    onclick="saveSong()"
  >
    保存
  </button>

</div>


</div>
</div>



<script>


let songs = [];

let editingIndex = null;


/*
  選択中の曲を管理
*/

const selectedSongs =
  new Set();



/* =========================
   CSV読込
========================= */

async function loadCSV() {

  try {

    const response =
      await fetch("songs.csv");


    if (!response.ok) {

      throw new Error(
        "CSV読み込み失敗"
      );

    }


    let text =
      await response.text();


    text =
      text.replace(
        /^\uFEFF/,
        ""
      );


    songs =
      parseCSV(text);


    createGenreOptions();

    render();


  } catch (error) {

    console.error(error);

    alert(
      "songs.csvを読み込めませんでした"
    );

  }

}



/* =========================
   CSV解析
========================= */

function parseCSV(text) {

  const lines =
    text
      .trim()
      .split(/\r?\n/);


  lines.shift();


  return lines

    .filter(
      line =>
        line.trim()
    )

    .map(line => {

      const c =
        parseLine(line);


      return {

        title:
          c[0]?.trim() || "",

        artist:
          c[1]?.trim() || "",

        genre:
          c[2]?.trim() || "その他",

        favorite:
          (
            c[3] || ""
          )
            .trim()
            .toLowerCase()
            === "true"

      };

    });

}



function parseLine(line) {

  const result = [];

  let current = "";

  let quote = false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];


    if (
      char === '"'
    ) {

      if (
        quote &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      } else {

        quote = !quote;

      }


    } else if (
      char === "," &&
      !quote
    ) {

      result.push(
        current
      );

      current = "";


    } else {

      current += char;

    }

  }


  result.push(
    current
  );


  return result;

}



/* =========================
   ジャンル
========================= */

function getGenres() {

  return [

    ...new Set(

      songs

        .map(
          song =>
            song.genre
        )

        .filter(Boolean)

    )

  ];

}



function createGenreOptions() {

  const genres =
    getGenres();


  /* =====================
     絞り込み用
  ===================== */

  const filter =
    document.getElementById(
      "genreFilter"
    );


  const oldFilter =
    filter.value;


  filter.innerHTML =
    '<option value="すべて">すべてのジャンル</option>';


  genres.forEach(
    genre => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        genre;

      option.textContent =
        genre;


      filter.appendChild(
        option
      );

    }
  );


  if (
    genres.includes(
      oldFilter
    )
  ) {

    filter.value =
      oldFilter;

  }



  /* =====================
     1曲編集用
  ===================== */

  const editor =
    document.getElementById(
      "genre"
    );


  const oldEditor =
    editor.value;


  editor.innerHTML = "";


  genres.forEach(
    genre => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        genre;

      option.textContent =
        genre;


      editor.appendChild(
        option
      );

    }
  );


  if (
    genres.includes(
      oldEditor
    )
  ) {

    editor.value =
      oldEditor;

  }



  /* =====================
     一括変更用
  ===================== */

  const bulk =
    document.getElementById(
      "bulkGenre"
    );


  const oldBulk =
    bulk.value;


  bulk.innerHTML = "";


  genres.forEach(
    genre => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        genre;

      option.textContent =
        genre;


      bulk.appendChild(
        option
      );

    }
  );


  if (
    genres.includes(
      oldBulk
    )
  ) {

    bulk.value =
      oldBulk;

  }

}



/* =========================
   表示判定
========================= */

function isSongVisible(
  song
) {

  const keyword =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const selectedGenre =
    document
      .getElementById(
        "genreFilter"
      )
      .value;


  const favoriteFilter =
    document
      .getElementById(
        "favoriteFilter"
      )
      .value;


  const matchesSearch =

    song.title
      .toLowerCase()
      .includes(
        keyword
      )

    ||

    song.artist
      .toLowerCase()
      .includes(
        keyword
      );


  const matchesGenre =

    selectedGenre ===
      "すべて"

    ||

    song.genre ===
      selectedGenre;


  const matchesFavorite =

    favoriteFilter ===
      "all"

    ||

    (
      favoriteFilter ===
        "favorite"

      &&

      song.favorite
    )

    ||

    (
      favoriteFilter ===
        "normal"

      &&

      !song.favorite
    );


  return (
    matchesSearch
    &&
    matchesGenre
    &&
    matchesFavorite
  );

}



/* =========================
   曲一覧表示
========================= */

function render() {

  const list =
    document.getElementById(
      "songList"
    );


  list.innerHTML = "";


  let visible =
    0;


  songs.forEach(
    (song, index) => {


      if (
        !isSongVisible(
          song
        )
      ) {

        return;

      }


      visible++;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "song";


      if (
        selectedSongs.has(
          song
        )
      ) {

        row.classList.add(
          "selected"
        );

      }



      /* チェック */

      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";

      checkbox.className =
        "select-song";

      checkbox.checked =
        selectedSongs.has(
          song
        );


      checkbox.addEventListener(
        "change",
        () => {

          if (
            checkbox.checked
          ) {

            selectedSongs.add(
              song
            );

          } else {

            selectedSongs.delete(
              song
            );

          }


          render();

        }
      );



      /* 曲情報 */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "song-info";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "song-title";


      /*
        CSV上で何番目か表示
      */

      title.textContent =
        `${index + 1}. `
        +
        (
          song.favorite
            ? "⭐ "
            : ""
        )
        +
        song.title;



      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "song-meta";


      meta.textContent =
        song.artist
        +
        " ｜ "
        +
        song.genre;



      info.appendChild(
        title
      );

      info.appendChild(
        meta
      );



      /* 編集 */

      const edit =
        document.createElement(
          "button"
        );


      edit.className =
        "edit-button";

      edit.textContent =
        "編集";


      edit.onclick =
        () =>
          openEdit(
            index
          );



      /* 削除 */

      const del =
        document.createElement(
          "button"
        );


      del.className =
        "delete-button";

      del.textContent =
        "削除";


      del.onclick =
        () =>
          deleteSong(
            index
          );



      row.appendChild(
        checkbox
      );

      row.appendChild(
        info
      );

      row.appendChild(
        edit
      );

      row.appendChild(
        del
      );


      list.appendChild(
        row
      );

    }
  );


  document
    .getElementById(
      "count"
    )
    .textContent =
      `${songs.length}曲登録中・${visible}曲表示`;


  updateSelectionPanel();

}



/* =========================
   表示中を全部選択
========================= */

function selectVisible() {

  songs.forEach(
    song => {

      if (
        isSongVisible(
          song
        )
      ) {

        selectedSongs.add(
          song
        );

      }

    }
  );


  render();

}



/* =========================
   選択解除
========================= */

function clearSelection() {

  selectedSongs.clear();


  document
    .getElementById(
      "movePosition"
    )
    .value = "";


  render();

}



/* =========================
   固定パネル
========================= */

function updateSelectionPanel() {

  const panel =
    document.getElementById(
      "selectionPanel"
    );


  const count =
    selectedSongs.size;


  document
    .getElementById(
      "selectionCount"
    )
    .textContent =
      `${count}曲選択中`;


  if (
    count > 0
  ) {

    panel.classList.add(
      "show"
    );

  } else {

    panel.classList.remove(
      "show"
    );

  }

}



/* =========================
   ↑ ↓ 移動
========================= */

function moveSelected(
  direction
) {

  if (
    selectedSongs.size === 0
  ) {

    return;

  }


  if (
    direction < 0
  ) {

    for (
      let i = 1;
      i < songs.length;
      i++
    ) {

      if (
        selectedSongs.has(
          songs[i]
        )

        &&

        !selectedSongs.has(
          songs[i - 1]
        )
      ) {

        [
          songs[i - 1],
          songs[i]
        ] =
        [
          songs[i],
          songs[i - 1]
        ];

      }

    }

  }


  if (
    direction > 0
  ) {

    for (
      let i =
        songs.length - 2;

      i >= 0;

      i--
    ) {

      if (
        selectedSongs.has(
          songs[i]
        )

        &&

        !selectedSongs.has(
          songs[i + 1]
        )
      ) {

        [
          songs[i],
          songs[i + 1]
        ] =
        [
          songs[i + 1],
          songs[i]
        ];

      }

    }

  }


  render();

}



/* =========================
   先頭へ
========================= */

function moveToTop() {

  if (
    selectedSongs.size === 0
  ) {

    return;

  }


  const selected =
    songs.filter(
      song =>
        selectedSongs.has(
          song
        )
    );


  const others =
    songs.filter(
      song =>
        !selectedSongs.has(
          song
        )
    );


  songs = [
    ...selected,
    ...others
  ];


  render();

}



/* =========================
   末尾へ
========================= */

function moveToBottom() {

  if (
    selectedSongs.size === 0
  ) {

    return;

  }


  const selected =
    songs.filter(
      song =>
        selectedSongs.has(
          song
        )
    );


  const others =
    songs.filter(
      song =>
        !selectedSongs.has(
          song
        )
    );


  songs = [
    ...others,
    ...selected
  ];


  render();

}



/* =========================
   指定番号へ移動
========================= */

function moveToPosition() {

  if (
    selectedSongs.size === 0
  ) {

    return;

  }


  const input =
    document.getElementById(
      "movePosition"
    );


  let position =
    Number(
      input.value
    );


  if (
    !Number.isInteger(
      position
    )

    ||

    position < 1
  ) {

    alert(
      "移動先の番号を入力してください"
    );

    return;

  }


  const selected =
    songs.filter(
      song =>
        selectedSongs.has(
          song
        )
    );


  const others =
    songs.filter(
      song =>
        !selectedSongs.has(
          song
        )
    );


  let insertIndex =
    position - 1;


  if (
    insertIndex >
    others.length
  ) {

    insertIndex =
      others.length;

  }


  others.splice(
    insertIndex,
    0,
    ...selected
  );


  songs =
    others;


  input.value =
    "";


  render();

}



/* =========================
   ジャンル一括変更
========================= */

function changeSelectedGenre() {

  if (
    selectedSongs.size === 0
  ) {

    return;

  }


  const genre =
    document
      .getElementById(
        "bulkGenre"
      )
      .value;


  if (!genre) {

    return;

  }


  const count =
    selectedSongs.size;


  if (
    !confirm(
      `${count}曲のジャンルを「${genre}」に変更しますか？`
    )
  ) {

    return;

  }


  selectedSongs.forEach(
    song => {

      song.genre =
        genre;

    }
  );


  /*
    ジャンル変更後に
    フィルター等を更新
  */

  createGenreOptions();

  render();

}



/* =========================

========================= */

function openAdd() {

/* =========================
   曲編集
========================= */

function openEdit(
  index
) {

  editingIndex =

  const song =
    songs[index];


  document
    .getElementById(
      "formTitle"
    )
    .textContent =

    .getElementById(

    )
    .value =

  document
    .getElementById(
      "artist"
    )
    .value =

  document
    .getElementById(
      "genre"
    )
    .value =

    .getElementById(
      "newGenre"
    )
    .value = "";

    .getElementById(

    .getElementById(

    )
    .classList.add(

    );

/* =========================
   曲保存
========================= */

function saveSong() {

  const title =
    document
      .getElementById(
        "title"
      )
      .value
      .trim();


  const artist =
    document
      .getElementById(
        "artist"
      )
      .value
      .trim();


  const selectedGenre =
    document
      .getElementById(
        "genre"
      )
      .value;


  const newGenre =
    document
      .getElementById(
        "newGenre"
      )
      .value
      .trim();


  const genre =
    newGenre
    ||
    selectedGenre
    ||
    "その他";


  const favorite =
    document
      .getElementById(
        "favorite"
      )
      .checked;


  if (!title) {

    alert(
      "曲名を入力してください"
    );

    return;

  }


  const song = {

    title,
    artist,
    genre,
    favorite

  };


  if (
    editingIndex === null
  ) {

    songs.push(
      song
    );

  } else {


    const oldSong =
      songs[
        editingIndex
      ];


    const wasSelected =
      selectedSongs.has(
        oldSong
      );


    selectedSongs.delete(
      oldSong
    );


    songs[
      editingIndex
    ] =
      song;


    if (
      wasSelected
    ) {

      selectedSongs.add(
        song
      );

    }

  }


  closeModal();

  createGenreOptions();

  render();

}



/* =========================
   削除
========================= */

function deleteSong(
  index
) {

  const song =
    songs[index];


  if (
    !confirm(
      `「${song.title}」を削除しますか？`
    )
  ) {

    return;

  }


  selectedSongs.delete(
    song
  );


  songs.splice(
    index,
    1
  );


  createGenreOptions();

  render();

}



/* =========================
   モーダルを閉じる
========================= */

function closeModal() {

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "show"
    );

}



/* =========================
   CSV
========================= */

function csvEscape(
  value
) {

  const text =
    String(
      value ?? ""
    );


  if (
    text.includes(",")
    ||
    text.includes('"')
    ||
    text.includes("\n")
  ) {

    return (
      '"'
      +
      text.replace(
        /"/g,
        '""'
      )
      +
      '"'
    );

  }


  return text;

}



function downloadCSV() {

  let csv =
    "title,artist,genre,favorite\r\n";


  songs.forEach(
    song => {

      csv +=

        csvEscape(
          song.title
        )

        + ","

        +

        csvEscape(
          song.artist
        )

        + ","

        +

        csvEscape(
          song.genre
        )

        + ","

        +

        song.favorite

        +

        "\r\n";

    }
  );


  const blob =
    new Blob(

      [
        "\uFEFF"
        +
        csv
      ],

      {
        type:
          "text/csv;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    "songs.csv";


  document.body.appendChild(
    a
  );


  a.click();

  a.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}



/* =========================
   イベント
========================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    render
  );


document
  .getElementById(
    "genreFilter"
  )
  .addEventListener(
    "change",
    render
  );


document
  .getElementById(
    "favoriteFilter"
  )
  .addEventListener(
    "change",
    render
  );



/* =========================
   起動
========================= */

loadCSV();


</script>
